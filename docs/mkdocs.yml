# 说明：当前使用已安装的 readthedocs 主题，mermaid 通过 extra_javascript 引入即可渲染。
# 若想改用 Material 主题：先 `pip install mkdocs-material`，再把下面 theme.name 改成 material，
# 并可为 material 增加 features（如 navigation.sections 等）。mermaid 配置两者通用。
theme:
  name: readthedocs

markdown_extensions:
  # 支持列表项内缩进的代码围栏（原生 fenced_code 只识别顶格围栏，
  # 缩进的围栏会被当成普通文本，页面上直接显示 ```bash）
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - admonition
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js
